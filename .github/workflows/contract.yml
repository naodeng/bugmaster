name: BugMaster contract and unit feedback
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Pin to reviewed full SHA before release; pending security review
      - uses: actions/setup-python@v5 # Pin to reviewed full SHA before release; pending security review
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.13.3 'jsonschema[format-nongpl]==4.26.0'
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m unittest discover -s tests/contracts -v
      - run: python -m coverage run --source=bugmaster_core -m unittest discover -s tests/unit
      - run: python -m coverage json -o coverage.json
      - run: python -c "import json; d=json.load(open('coverage.json')); assert d['totals']['percent_covered_lines'] == 100, d['totals']"
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_benchmark.py
      - run: python scripts/check_branding.py
