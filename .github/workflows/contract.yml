name: BugMaster contract and unit feedback
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.13.3 'jsonschema[format-nongpl]==4.26.0'
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m unittest discover -s tests/contracts -v
      - run: python -m unittest discover -s tests/security -v
      - run: python -m coverage run --branch --source=bugmaster_core,scripts -m unittest discover -s tests/unit
      - run: python -m coverage json -o coverage.json
      - run: python -m coverage report -m
      - run: python -c "import json; d=json.load(open('coverage.json')); t=d['totals']; missing={path:report['missing_lines'] for path, report in d.get('files', {}).items() if report.get('missing_lines')}; assert t['num_statements'] > 0 and t['covered_lines'] == t['num_statements'], {**t, 'uncovered_lines':missing}"
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_benchmark.py
      - run: python scripts/check_branding.py
