name: BugMaster release quality gate (expected No-Go during development)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install coverage==7.13.3 'jsonschema[format-nongpl]==4.26.0'
      - run: python -m coverage run --branch --source=bugmaster_core,scripts -m unittest discover -s tests/unit
      - run: python -m coverage json -o coverage.json
      - run: python scripts/quality_gate.py --mode release --coverage coverage.json
      # Additional real-host, evidence and 50-case benchmark gates required prior to release.
